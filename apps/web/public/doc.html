<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>문서 원문 — CI-TEC Knowledge</title>
  <link rel="stylesheet" href="/css/theme.css"/>
  <link rel="stylesheet" href="/css/markdown.css"/>
  <style>
    :root { --bg:#f6f8fb; --card:#fff; --text:#0f172a; --muted:#64748b; --primary:#1428A0; --border:#e2e8f0; }
    * { box-sizing: border-box; }
    body { margin:0; font-family: var(--font-sans); background:var(--bg); color:var(--text); line-height:1.55; }
    .wrap { max-width:960px; margin:0 auto; padding:20px 16px 60px; }
    h1 { font-size:1.25rem; margin:0 0 8px; }
    .meta { color:var(--muted); font-size:13px; margin-bottom:14px; }
    .card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px 18px; }
    .err { background:#fef2f2; color:#b91c1c; padding:12px; border-radius:8px; }
    .meta, h1 { overflow-wrap:anywhere; }
    .src-row { display:flex; flex-wrap:wrap; gap:8px; align-items:center; margin:0 0 12px; }
    a.src-btn { display:inline-block; padding:7px 14px; border-radius:8px; background:#1d4ed8; color:#fff; font-weight:700; font-size:13px; text-decoration:none; }
    a.src-btn:hover { background:#1e40af; }
    .notice { font-size:12px; color:#92400e; background:#fffbeb; border:1px solid #fde68a; border-radius:8px; padding:6px 10px; }
    table.fm { border-collapse:collapse; font-size:13px; margin:0 0 14px; width:100%; }
    table.fm th { text-align:left; white-space:nowrap; vertical-align:top; color:var(--muted); font-weight:600; padding:3px 12px 3px 0; width:1%; }
    table.fm td { padding:3px 0; overflow-wrap:anywhere; }
    .badge { display:inline-block; font-size:11px; font-weight:700; padding:2px 8px; border-radius:999px; background:#eff6ff; color:#1d4ed8; margin-right:6px; }
    .row { display:flex; gap:8px; flex-wrap:wrap; margin-bottom:12px; }
    button, .btn {
      background:var(--primary); color:#fff; border:0; border-radius:10px; padding:8px 14px;
      font-weight:700; cursor:pointer; text-decoration:none; font-size:13px; display:inline-block;
    }
    button.ghost, .btn.ghost { background:#fff; color:var(--primary); border:1px solid var(--border); }
    pre.raw { white-space:pre-wrap; font-size:13px; background:#0f172a; color:#e2e8f0; padding:12px; border-radius:10px; overflow:auto; }
  </style>
</head>
<body>
<div class="top" id="topNav" data-page="doc"></div>
<div style="padding:4px 20px 0"><span id="navTitle" class="meta" style="margin:0"></span></div>
<div class="wrap">
  <div class="row">
    <button type="button" class="ghost" id="btnBack">← 뒤로</button>
    <button type="button" class="ghost" id="btnToggle">Markdown / 원문 텍스트</button>
    <a class="btn ghost" id="btnApi" href="#" target="_blank" rel="noopener">API JSON</a>
  </div>
  <h1 id="title">로딩…</h1>
  <div class="meta" id="meta"></div>
  <div class="src-row" id="srcRow"></div>
  <div class="card">
    <div id="body" class="md-body">로딩…</div>
  </div>
</div>
<script src="/js/auth.js"></script>
<script src="/js/nav.js"></script>
<script src="/js/markdown.js?v=20261021"></script>
<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const params = new URLSearchParams(location.search);
  const eid = (params.get("eid") || "").trim();
  const st = (params.get("st") || "support_history").trim();
  const path = (params.get("path") || "").trim();
  const kind = (params.get("kind") || "").trim();
  const wantTitle = params.get("title") || "";
  let rawMd = "";
  let structured = null; // checkitem sections
  let showRaw = false;

  $("btnBack").onclick = () => {
    if (history.length > 1) { history.back(); return; }
    // 결과 카드의 「원문 보기」는 새 탭(target=_blank)이라 되돌아갈 히스토리가 없다.
    // 탭을 닫아 원래 검색 결과 탭으로 복귀하고, 닫히지 않을 때만 홈으로 이동.
    window.close();
    setTimeout(() => { location.href = "/"; }, 150);
  };
  $("btnToggle").onclick = () => {
    showRaw = !showRaw;
    renderBody();
  };

  function esc(s) {
    return String(s ?? "").replace(/[&<>"']/g, (c) =>
      ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])
    );
  }

  function renderCheckitemSections(sections) {
    let html = "";
    for (const sec of sections || []) {
      if (!sec || sec.value == null || sec.value === "") continue;
      const body = (window.CitecMD && CitecMD.render)
        ? CitecMD.render(String(sec.value))
        : esc(String(sec.value));
      html += `<section style="border-top:1px solid var(--border);padding:12px 0 6px">
        <div style="font-size:12px;font-weight:700;color:var(--primary);margin-bottom:6px">${esc(sec.label || sec.key)}</div>
        <div class="md-body" style="font-size:14px">${body}</div>
      </section>`;
    }
    return html || "<p class='meta'>(필드 없음)</p>";
  }

  // "--- key : value ---" frontmatter (confluence_map / confluence_docs / tech_repo …)
  function splitFrontmatter(md) {
    const m = /^---\r?\n([\s\S]*?)\r?\n---[ \t]*(?:\r?\n|$)/.exec(md || "");
    if (!m) return { fm: null, rest: md || "" };
    const fm = {};
    for (const line of m[1].split(/\r?\n/)) {
      const i = line.search(/\s:\s|:\s*$/);
      if (i < 0) continue;
      const k = line.slice(0, i).trim();
      if (k) fm[k] = line.slice(i).replace(/^\s*:\s*/, "").trim();
    }
    return { fm: Object.keys(fm).length ? fm : null, rest: md.slice(m[0].length) };
  }

  function httpUrl(u) {
    u = String(u || "").trim();
    return /^https?:\/\//i.test(u) ? u : "";
  }

  const FM_HIDE = new Set(["URL", "제목", "Page ID", "구분", "조상ID목록", "최종수정일시각", "space_key", "tech_relevant", "citec_domains"]);

  function fmTableHtml(fm) {
    const rows = Object.entries(fm || {})
      .filter(([k, v]) => v && !FM_HIDE.has(k))
      .map(([k, v]) => `<tr><th>${esc(k)}</th><td>${esc(v)}</td></tr>`);
    return rows.length ? `<table class="fm">${rows.join("")}</table>` : "";
  }

  function renderBody() {
    if (showRaw) {
      if (structured && structured.sections) {
        $("body").innerHTML = `<pre class="raw">${esc(JSON.stringify(structured, null, 2))}</pre>`;
      } else {
        $("body").innerHTML = `<pre class="raw">${esc(rawMd || "(본문 없음)")}</pre>`;
      }
    } else if (structured && structured.sections) {
      $("body").innerHTML = renderCheckitemSections(structured.sections);
    } else {
      const { fm, rest } = splitFrontmatter(rawMd);
      const text = (fm ? rest : rawMd) || "(본문 없음)";
      const html = (window.CitecMD && CitecMD.render) ? CitecMD.render(text) : `<pre>${esc(text)}</pre>`;
      $("body").innerHTML = (fm ? fmTableHtml(fm) : "") + html;
    }
  }

  async function load() {
    const api = window.CitecAuth && CitecAuth.apiFetch
      ? (u) => CitecAuth.apiFetch(u)
      : (u) => fetch(u);
    let d = null;
    let apiUrl = "";
    try {
      // 1) PISA checkitem structured JSON
      if (eid && (st === "checkitem" || kind === "checkitem" || /^PISA/i.test(eid))) {
        apiUrl = "/v1/checkitems/" + encodeURIComponent(eid);
        let r = await api(apiUrl);
        if (r.ok) {
          d = await r.json();
          structured = d;
          rawMd = [
            `# ${d.title || d.code}`,
            "",
            ...((d.sections || []).map((s) => `## ${s.label}\n${s.value || ""}`)),
          ].join("\n");
        }
      }
      // 2) tickets / documents
      if (!d && eid) {
        apiUrl = "/v1/tickets/" + encodeURIComponent(eid) + "?source_type=" + encodeURIComponent(st || "support_history");
        let r = await api(apiUrl);
        if (r.ok) {
          d = await r.json();
        }
      }
      if (!d) {
        const p = path || (eid ? st + "/" + eid + (String(eid).endsWith(".md") ? "" : ".md") : "");
        if (!p) throw new Error("eid 또는 path 쿼리가 필요합니다.");
        apiUrl = "/api/wiki/file?path=" + encodeURIComponent(p);
        const r = await api(apiUrl);
        if (!r.ok) {
          const err = await r.json().catch(() => ({}));
          throw new Error(err.detail || r.statusText || "문서를 찾을 수 없습니다");
        }
        const w = await r.json();
        d = {
          title: w.title || wantTitle || p,
          body_md: w.content || "",
          external_id: eid || (w.meta && w.meta.external_id) || p,
          source_type: st || (w.meta && w.meta.source_type) || "",
          component: w.meta && (w.meta.component || w.meta.Component),
          status: w.meta && (w.meta.status || w.meta.Status),
          assignee: w.meta && (w.meta.assignee || w.meta.Assignee),
          Created: w.meta && w.meta.Created,
          path: w.path || p,
          source_url: w.source_url,
          access: w.access,
        };
      }
      if (!rawMd) rawMd = d.body_md || "";
      const title = d.title || wantTitle || d.external_id || d.code || "문서";
      document.title = title + " — 원문";
      $("title").textContent = title;
      $("navTitle").textContent = d.external_id || d.code || "";
      $("meta").innerHTML =
        `<span class="badge">${esc(d.source_type || st || (structured ? "checkitem" : ""))}</span>` +
        `<span class="badge">${esc(d.external_id || d.code || eid || "-")}</span>` +
        (d.area ? ` · area=${esc(d.area)}` : "") +
        (d.component ? ` · component=${esc(d.component)}` : "") +
        (d.status ? ` · status=${esc(d.status)}` : "") +
        (d.assignee ? ` · assignee=${esc(d.assignee)}` : "") +
        (d.Created ? ` · Created=${esc(d.Created)}` : "");
      // 원문(Confluence 등) 링크: API source_url 우선, 없으면 frontmatter URL
      const fm = splitFrontmatter(rawMd).fm;
      const src = httpUrl(d.source_url) || httpUrl(d.access && d.access.source_url) || httpUrl(fm && fm.URL);
      const sr = $("srcRow");
      sr.innerHTML = "";
      if (src) {
        const a = document.createElement("a");
        a.className = "src-btn";
        a.href = src;
        a.target = "_blank";
        a.rel = "noopener noreferrer";
        a.textContent = /confluence|viewpage|atlassian/i.test(src) ? "Confluence 원문 열기 ↗" : "원문 열기 ↗";
        sr.appendChild(a);
      }
      if ((d.source_type || st) === "confluence_map") {
        const n = document.createElement("span");
        n.className = "notice";
        n.textContent = "KB 저장본(텍스트 발췌/추출)입니다. 표·서식은 손실되었을 수 있으니 정확한 내용은 Confluence 원문을 확인하세요.";
        sr.appendChild(n);
      }
      $("btnApi").href = apiUrl;
      $("btnToggle").textContent = structured
        ? "구조 뷰 / JSON 원문"
        : "Markdown / 원문 텍스트";
      renderBody();
    } catch (e) {
      $("title").textContent = "문서 로드 실패";
      $("body").innerHTML = `<div class="err">${esc(e.message || e)}</div>`;
    }
  }

  load();
})();
</script>
</body>
</html>
